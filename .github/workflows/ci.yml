name: Проверка сайта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить и собрать сайт
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://maria-galieva.ru
          PUBLIC_SITE_INDEXING: 'true'
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Проверить открытую SEO-сборку
        run: npm run verify:seo:open

      - name: Проверить аналитику и изображения
        run: npm run verify:analytics:configured && npm run verify:images
