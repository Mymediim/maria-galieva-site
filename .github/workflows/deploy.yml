name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://maria-galieva.ru
          PUBLIC_SITE_INDEXING: 'false'

      - name: Загрузить сборку
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
